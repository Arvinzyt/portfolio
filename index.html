<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集</title>
  <meta name="description" content="个人 / 团队作品集" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23778652'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="nav">
    <a class="nav-logo" href="#top"><span id="nav-brand-sub"></span><b id="nav-brand"></b></a>
    <nav class="nav-links" id="nav-links"></nav>
  </header>

  <main id="top">

    <!-- Hero -->
    <section class="hero wrap">
      <div class="hero-meta" id="hero-meta"></div>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-intro" id="hero-intro"></p>
      <div class="hero-scroll">Scroll</div>
    </section>

    <!-- 关于 -->
    <section class="section wrap" id="about">
      <div class="sec-label reveal"><b>01</b><span id="label-about"></span></div>
      <div class="about-grid">
        <div class="about-text reveal" id="about-text"></div>
        <div class="about-side reveal" id="about-side"></div>
      </div>
    </section>

    <!-- 项目 -->
    <section class="section wrap" id="projects">
      <div class="sec-label reveal"><b>02</b><span id="label-projects"></span></div>
      <ul class="project-list reveal" id="project-list"></ul>
    </section>

    <!-- 服务 / 能力 -->
    <section class="section wrap" id="services">
      <div class="sec-label reveal"><b>03</b><span id="label-services"></span></div>
      <ul class="svc-list reveal" id="svc-list"></ul>
    </section>

    <!-- 联系 -->
    <section class="section contact wrap" id="contact">
      <div class="sec-label reveal"><b>04</b><span id="label-contact"></span></div>
      <h2 class="contact-heading reveal" id="contact-heading"></h2>
      <div class="reveal"><a class="contact-mail" id="contact-mail"></a></div>
      <div class="contact-socials reveal" id="contact-socials"></div>
    </section>

  </main>

  <footer class="foot wrap">
    <div class="foot-brand" id="foot-brand" aria-hidden="true"></div>
    <div class="foot-bar">
      <span id="foot-note"></span>
      <a class="lnk" href="#top">Back to top ↑</a>
    </div>
  </footer>

  <!-- 项目悬浮预览图 -->
  <div class="preview" id="preview"><img alt="" /></div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
