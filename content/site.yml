  title: "相信少即是多，用留白与秩序让内容自己说话。"
  paragraphs:
    - "白昼工作室成立于 2021 年，成员来自设计与工程背景。我们不追逐潮流样式，而是从内容本身出发，为每个项目找到最合适的表达方式。"
